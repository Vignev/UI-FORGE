<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  /* UI Forge Button CSS Variables - Default theme */
  :root {
    --uif-primary: #3b82f6;
    --uif-primary-hover: #2563eb;
    --uif-primary-text: #ffffff;
    --uif-secondary: #e5e7eb;
    --uif-secondary-hover: #d1d5db;
    --uif-secondary-text: #1f2937;
    --uif-outline-border: #d1d5db;
    --uif-outline-text: #374151;
    --uif-outline-hover: #f3f4f6;
    --uif-ghost-text: #374151;
    --uif-ghost-hover: #f3f4f6;
    --uif-danger: #ef4444;
    --uif-danger-hover: #dc2626;
    --uif-danger-text: #ffffff;
    --uif-secondary-dark: #374151;
    --uif-secondary-hover-dark: #4b5563;
    --uif-secondary-text-dark: #f3f4f6;
    --uif-outline-border-dark: #4b5563;
    --uif-outline-text-dark: #d1d5db;
    --uif-outline-hover-dark: #1f2937;
    --uif-ghost-text-dark: #d1d5db;
    --uif-ghost-hover-dark: #1f2937;
    --uif-font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  /* Button Base Styles */
  .uif-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-weight: 500;
    border-radius: 0.375rem;
    border: none;
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    font-family: var(--uif-font-family);
  }

  .uif-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .uif-btn-spinner {
    height: 1rem;
    width: 1rem;
    animation: uif-spin 1s linear infinite;
  }

  .uif-btn-icon-start,
  .uif-btn-icon-end {
    display: inline-flex;
    align-items: center;
  }

  .uif-btn-icon-start:empty,
  .uif-btn-icon-end:empty {
    display: none;
  }

  @keyframes uif-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Sizes */
  .uif-btn-sm { height: 2rem; padding-left: 0.75rem; padding-right: 0.75rem; font-size: 0.875rem; }
  .uif-btn-md { height: 2.5rem; padding-left: 1rem; padding-right: 1rem; font-size: 1rem; }
  .uif-btn-lg { height: 3rem; padding-left: 1.5rem; padding-right: 1.5rem; font-size: 1.125rem; }
  .uif-btn-full { width: 100%; }

  /* Primary variant */
  .uif-btn-primary {
    background-color: var(--uif-primary);
    color: var(--uif-primary-text);
  }
  .uif-btn-primary:hover:not(:disabled) {
    background-color: var(--uif-primary-hover);
  }

  /* Secondary variant */
  .uif-btn-secondary {
    background-color: var(--uif-secondary);
    color: var(--uif-secondary-text);
  }
  .uif-btn-secondary:hover:not(:disabled) {
    background-color: var(--uif-secondary-hover);
  }

  /* Outline variant */
  .uif-btn-outline {
    background-color: transparent;
    border: 1px solid var(--uif-outline-border);
    color: var(--uif-outline-text);
  }
  .uif-btn-outline:hover:not(:disabled) {
    background-color: var(--uif-outline-hover);
  }

  /* Ghost variant */
  .uif-btn-ghost {
    background-color: transparent;
    color: var(--uif-ghost-text);
  }
  .uif-btn-ghost:hover:not(:disabled) {
    background-color: var(--uif-ghost-hover);
  }

  /* Danger variant */
  .uif-btn-danger {
    background-color: var(--uif-danger);
    color: var(--uif-danger-text);
  }
  .uif-btn-danger:hover:not(:disabled) {
    background-color: var(--uif-danger-hover);
  }

  /* Dark theme overrides */
  [data-theme="dark"] .uif-btn-secondary {
    background-color: var(--uif-secondary-dark);
    color: var(--uif-secondary-text-dark);
  }
  [data-theme="dark"] .uif-btn-secondary:hover:not(:disabled) {
    background-color: var(--uif-secondary-hover-dark);
  }
  [data-theme="dark"] .uif-btn-outline {
    border-color: var(--uif-outline-border-dark);
    color: var(--uif-outline-text-dark);
  }
  [data-theme="dark"] .uif-btn-outline:hover:not(:disabled) {
    background-color: var(--uif-outline-hover-dark);
  }
  [data-theme="dark"] .uif-btn-ghost {
    color: var(--uif-ghost-text-dark);
  }
  [data-theme="dark"] .uif-btn-ghost:hover:not(:disabled) {
    background-color: var(--uif-ghost-hover-dark);
  }

  body {
    font-family: var(--uif-font-family);
  }
</style>
